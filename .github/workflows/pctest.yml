# End-to-end test of the PC worker on a Windows machine: it fetches the real job and programs from GitHub Pages,
# solves a few preflop tasks and one flop, and the result lines are checked.
name: PC-Rechner-Test
on: workflow_dispatch
jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Preflop
        shell: powershell
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'SpinRechner'; New-Item -ItemType Directory -Force $d | Out-Null
          Invoke-WebRequest -UseBasicParsing "https://markusloechli27-wq.github.io/spin-gold/pc/spin-pc.ps1?t=$(Get-Date -UFormat %s)" -OutFile "$d\spin-pc.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$d\spin-pc.ps1" -Max 9 -Kerne 2
          Get-Content "$d\log.txt"
          python -c "import json,sys; L=[json.loads(l) for l in open(sys.argv[1], encoding='utf-8')]; print(len(L), 'lines'); [print(o['v'], o.get('m'), o.get('k'), 'base' if 'd' in o else 'patch', len(o.get('d') or o.get('pd') or {}), 'nodes', sum(1 for n in (o.get('pd') or {}).values() if 'lk' in n), 'with lk', o.get('ex', '')) for o in L]; P={o['k']: o['pd'] for o in L if 'pd' in o}; assert P['5|5|5'] != P['5|7.5|7.5'], 'stacks did not reach the program'; print('5|5|5 and 5|7.5|7.5 differ: ok')" "$d\ergebnis-pc-v2.jsonl"
      - name: Flop
        shell: powershell
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'SpinRechner'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$d\spin-pc.ps1" -Max 1 -Kerne 2 -NurFlops
          Get-Content "$d\log.txt" -Tail 4
          Get-Content "$d\ergebnis-pc-v2.jsonl" | Select-Object -Last 1 | ForEach-Object { $_.Substring(0, [Math]::Min(300, $_.Length)) }
          python -c "import json,sys; L=[json.loads(l) for l in open(sys.argv[1], encoding='utf-8')]; f=[o for o in L if 'sid' in o]; print(len(f), 'flops', [(o['sid'], o['r']['flop'], o['r'].get('expl'), o['r']['cbet']['acts']) for o in f]); assert len(f[0]['r']['cbet']['acts']) == 5, 'flop settings did not reach the program'" "$d\ergebnis-pc-v2.jsonl"
